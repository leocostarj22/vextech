:root{color-scheme:light;--bg:#f4f7f6;--panel:#fff;--rail:#fafcfb;--ink:#17272c;--muted:#687b80;--line:#e1e9e7;--cyan:#68d2df;--teal:#216a72;--soft:#edf8f8;--shadow:0 18px 60px #182b3210;--night:#10111e;--badge:#eaf0ef}
:root[data-theme=dark]{color-scheme:dark;--bg:#0e1720;--panel:#14222d;--rail:#101c26;--ink:#eef5f7;--muted:#a0b2be;--line:#293c49;--teal:#84d9e3;--soft:#1c353f;--shadow:0 18px 60px #0002;--badge:#213541}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Geist,Arial,sans-serif}button,input,select,textarea{font:inherit}button,a{color:inherit}button{cursor:pointer}a{text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:3px}h1,h2,h3,p{margin:0}h1,h2,h3{font-weight:500}svg{width:20px;height:20px;display:block;flex-shrink:0}button{border:0}button:disabled{cursor:default;opacity:.6}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.prototype-bar{height:34px;background:var(--night);color:#e8f3f4;display:flex;align-items:center;justify-content:center;gap:22px;font-size:10px;letter-spacing:.025em;padding:0 18px;position:relative;z-index:50}.prototype-bar strong{color:var(--cyan);font-weight:500}.prototype-bar button{background:none;color:var(--cyan);padding:2px 0;border-bottom:1px solid #68d2df60;font-size:10px}
.rail{position:fixed;inset:34px auto 0 0;width:224px;background:var(--rail);border-right:1px solid var(--line);padding:29px 19px 20px;display:flex;flex-direction:column;z-index:30}.brand{display:flex;align-items:center;gap:10px;padding:0 9px}.brand .icon{width:28px;color:var(--cyan)}.brand .word{width:130px}.brand svg{width:100%;height:auto}.rail-sub{font-size:9px;letter-spacing:.19em;text-transform:uppercase;color:var(--muted);margin:17px 0 42px 10px}.rail-group{font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding:0 12px;margin:0 0 13px}.rail nav{display:grid;gap:7px}.nav-item{display:flex;align-items:center;gap:12px;border-radius:10px;background:none;color:var(--muted);padding:12px;font-size:13px;text-align:left;white-space:nowrap}.nav-item svg{width:18px;height:18px}.nav-item b{font-size:10px;font-weight:500;min-width:21px;text-align:center;margin-left:auto;background:var(--badge);padding:2px 6px;border-radius:6px}.nav-item.active{color:var(--teal);background:var(--soft)}.nav-item.active b{background:var(--cyan);color:var(--night)}.nav-item:hover{background:var(--soft);color:var(--teal)}.rail-future{margin-top:31px;padding:0 12px;color:var(--muted)}.rail-future p{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:13px}.rail-future span{display:flex;justify-content:space-between;margin:15px 0;font-size:12px}.rail-future small{font-size:9px;border:1px solid var(--line);border-radius:4px;padding:1px 5px}.rail-bottom{margin-top:auto;border-top:1px solid var(--line);padding:20px 10px 0}.rail-bottom button{background:none;color:var(--muted);display:flex;gap:10px;padding:0;font-size:12px}.rail-bottom small{display:block;color:var(--muted);font-size:10px;margin-top:17px}
.shell{margin-left:224px}.topbar{height:80px;border-bottom:1px solid var(--line);padding:0 32px;display:flex;align-items:center;gap:20px;background:var(--panel)}.crumb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:12px;white-space:nowrap}.crumb span{color:var(--ink)}.topbar-right{display:flex;gap:12px;align-items:center;margin-left:auto}.search-global{width:235px;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--muted)}.search-global svg{width:16px;height:16px}.search-global input{width:100%;min-width:0;background:none;border:0;color:var(--ink);font-size:12px;outline:none}.icon-button{height:38px;width:38px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--panel)}.icon-button svg{width:17px;height:17px}.avatar-user{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);background:var(--soft);color:var(--teal);border-radius:50%;font-size:11px}.mobile-menu,.mobile-brand{display:none}

</span></div><div class="crumb">Talento <span>/</span> <span id="crumb">Visão geral</span></div><div class="topbar-right"><label class="search-global"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></svg><input id="global-search" type="search" aria-label="Pesquisar candidaturas" placeholder="Pesquisar candidatura…"></label><button class="icon-button" id="theme-toggle" aria-label="Alternar tema"></button><button class="icon-button" id="alerts" aria-label="Ver próximas ações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8M10 21h4"/></svg></button><div class="avatar-user" title="Equipa Vextech · perfil ilustrativo">VT</div></div></header><main id="main"></main></div>
<dialog class="drawer" id="drawer" aria-labelledby="drawer-title"><div class="drawer-content" id="drawer-content"></div></dialog><div class="toast" id="toast" role="status" hidden></div>
<script>
const ICONS={"grid": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/></svg>", "people": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3\"/><path d=\"M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5\"/></svg>", "brief": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"7\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M8 7V4h8v3M3 12a24 24 0 0 0 18 0M12 12v4\"/></svg>", "layers": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 3 10 6-10 6L2 9Zm-10 12 10 6 10-6M2 12l10 6 10-6\"/></svg>", "menu": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 8h16M4 16h16\"/></svg>", "search": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"6.5\"/><path d=\"m15 15 6 6\"/></svg>", "bell": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8M10 21h4\"/></svg>", "calendar": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M7 3v5M17 3v5M3 11h18M8 15h2M14 15h2\"/></svg>", "arrow": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 18 12-12M6 6h12v12\"/></svg>", "plus": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 4v16M4 12h16\"/></svg>", "list": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01\"/></svg>", "close": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 6 12 12M6 18 18 6\"/></svg>", "file": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M14 2H5a1 1 0 0 0-1 1v18a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V8ZM14 2v6h6M8 13h8M8 17h6\"/></svg>", "moon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 13a9 9 0 0 1-10-10A9 9 0 1 0 21 13Z\"/></svg>", "sun": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5\"/></svg>"};
const STAGES=['Recebida','Triagem','Entrevista','Proposta','Contratado','Não selecionado'];
const COLORS=['#9aaeb6','#68d2df','#aaa1cf','#d9bb82','#86bda1','#ce9e9a'];
const CLASSES=['s-recebida','s-triagem','s-entrevista','s-proposta','s-contratado','s-nao'];
const jobs=[{id:'java',title:'Java Developer',location:'Porto',active:true,description:'Conteúdo da vaga editável no painel. Esta é uma pré-visualização do editor.'},{id:'php',title:'PHP Developer',location:'Braga',active:true,description:'Descrição e requisitos são apresentados na página individual da vaga.'}];
const sample=[['java',0,0,'Recrutador A'],['php',0,0,'Recrutador B'],['java',1,1,'Recrutador A'],['php',1,1,'Recrutador B'],['java',2,2,'Recrutador A'],['php',0,3,''],['java',1,4,'Recrutador A'],['php',2,6,'Recrutador B'],['java',3,8,'Recrutador A'],['java',2,12,'Recrutador A'],['php',1,18,'Recrutador B'],['java',4,27,'Recrutador A']];
const today=new Date();today.setHours(12,0,0,0);
const apps=sample.map(([job,stage,age,owner],i)=>({id:i+1,name:`Perfil ${String(i+1).padStart(2,'0')}`,email:`perfil${String(i+1).padStart(2,'0')}@example.test`,job,stage,age,owner,notes:[],history:[{text:'Candidatura recebida · exemplo',date:new Date(today.getTime()-age*86400000)}]}));
const state={view:'dashboard',days:30,job:'all',owner:'all',stage:'all',q:'',layout:'board',focus:null};
const main=document.getElementById('main'),drawer=document.getElementById('drawer');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jobOf=a=>jobs.find(j=>j.id===a.job);
const dateOf=a=>new Date(today.getTime()-a.age*86400000);
const fmt=d=>d.toLocaleDateString('pt-PT',{day:'numeric',month:'short'});
const selected=(a,b)=>a===b?' selected':'';
const stageTag=a=>`<span class="stage ${CLASSES[a.stage]}">${STAGES[a.stage]}</span>`;
const person=a=>`<div class="person"><span class="person-icon">${String(a.id).padStart(2,'0')}</span><div class="person-text"><strong>${a.name}</strong><span>Candidatura #VT-${String(a.id).padStart(3,'0')}</span></div></div>`;
function baseApps(){return apps.filter(a=>a.age<state.days&&(state.job==='all'||a.job===state.job));}
function filtered(){return baseApps().filter(a=>(state.stage==='all'||(state.stage==='review'?a.stage<2:String(a.stage)===state.stage))&&(state.owner==='all'||(state.owner==='none'?!a.owner:a.owner===state.owner))&&(!state.focus||(a.age>=state.focus.min&&a.age<=state.focus.max))&&`${a.name} VT-${String(a.id).padStart(3,'0')} ${a.email} ${jobOf(a).title}`.toLowerCase().includes(state.q.toLowerCase()));}
function notify(text){const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.hidden=true,3400);}
function heading(kicker,title,sub,action=''){return `<div class="page-heading"><div><p class="eyebrow">${kicker}</p><h1>${title}</h1><p class="intro">${sub}</p></div>${action}</div>`;}
function filters(extra=false){return `<div class="filters"><label>${ICONS.calendar}<span class="sr">Período</span><select data-filter="days" aria-label="Período"><option value="7"${selected(state.days,7)}>Últimos 7 dias</option><option value="30"${selected(state.days,30)}>Últimos 30 dias</option><option value="90"${selected(state.days,90)}>Últimos 90 dias</option></select></label><label>${ICONS.brief}<select data-filter="job" aria-label="Vaga"><option value="all">Todas as vagas</option>${jobs.map(j=>`<option value="${j.id}"${selected(state.job,j.id)}>${esc(j.title)}</option>`).join('')}</select></label>${extra?`<label class="search-local">${ICONS.search}<input type="search" data-filter="q" aria-label="Pesquisar perfis" placeholder="Pesquisar perfil…" value="${esc(state.q)}"></label><label><select data-filter="stage" aria-label="Etapa"><option value="all">Todas as etapas</option><option value="review"${selected(state.stage,'review')}>Recebidas e triagem</option>${STAGES.map((s,i)=>`<option value="${i}"${selected(state.stage,String(i))}>${s}</option>`).join('')}</select></label><label><select data-filter="owner" aria-label="Responsável"><option value="all">Todos os responsáveis</option><option value="none"${selected(state.owner,'none')}>Por atribuir</option><option${selected(state.owner,'Recrutador A')}>Recrutador A</option><option${selected(state.owner,'Recrutador B')}>Recrutador B</option></select></label>`:''}${state.focus?`<button class="filter-clear" data-clear-focus>Limpar intervalo ×</button>`:''}<span class="explanation">${state.focus?'Intervalo selecionado no gráfico':'Dados da demonstração'}</span></div>`;}
function recentTable(list,full=false){return `<div class="table-wrap"><table><thead><tr><th>Candidatura</th><th>Vaga</th><th>Etapa</th>${full?'<th>Responsável</th>':''}<th>Recebida</th><th><span class="sr">Abrir ficha</span></th></tr></thead><tbody>${list.map(a=>`<tr data-profile="${a.id}" tabindex="0" aria-label="Abrir ${a.name}"><td>${person(a)}</td><td>${esc(jobOf(a).title)}</td><td>${stageTag(a)}</td>${full?`<td>${a.owner||'Por atribuir'}</td>`:''}<td style="color:var(--muted);white-space:nowrap">${fmt(dateOf(a))}</td><td><button class="row-link" data-profile="${a.id}" aria-label="Abrir ${a.name}">${ICONS.arrow}</button></td></tr>`).join('')}</tbody></table>${list.length?'':'<div class="empty">Nenhuma candidatura corresponde aos filtros. Experimenta outro período ou limpa a pesquisa.</div>'}</div>`;}
function taskRows(){return [{id:11,title:'Rever candidatura',sub:'Perfil 11 · PHP Developer',icon:'search'},{id:6,title:'Atribuir responsável',sub:'Perfil 06 · sem responsável',icon:'people'},{id:5,title:'Preparar entrevista',sub:'Perfil 05 · Java Developer',icon:'calendar'}].map(t=>`<button class="task" data-profile="${t.id}"><span class="task-marker">${ICONS[t.icon]}</span><span><strong>${t.title}</strong><small>${t.sub}</small></span>${ICONS.arrow}</button>`).join('');}
function dashboard(){const list=baseApps(),counts=STAGES.map((_,i)=>list.filter(a=>a.stage===i).length);const n=state.days===7?7:6;const step=Math.ceil(state.days/n);const bins=Array.from({length:n},(_,i)=>({min:(n-i-1)*step,max:(n-i)*step-1}));const vals=bins.map(b=>list.filter(a=>a.age>=b.min&&a.age<=b.max).length),max=Math.max(1,...vals);
return heading('Vextech / Centro de talento','Talento para o próximo passo.','Uma visão clara das oportunidades, das pessoas e das próximas ações.',`<button class="btn" data-go-candidates>Ver candidaturas ${ICONS.arrow}</button>`)+filters()+`<section class="metrics" aria-label="Indicadores ilustrativos"><button class="metric" data-view="vagas"><span class="metric-top">Vagas ativas ${ICONS.brief}</span><strong>${jobs.filter(j=>j.active).length}</strong><small><i class="dot"></i>Situação atual · todas as vagas</small></button><button class="metric" data-go-candidates><span class="metric-top">Candidaturas ${ICONS.people}</span><strong>${list.length}</strong><small>No período selecionado</small></button><button class="metric" data-kpi="review"><span class="metric-top">Por analisar ${ICONS.search}</span><strong>${counts[0]+counts[1]}</strong><small>Recebidas e em triagem</small></button><button class="metric" data-kpi="interview"><span class="metric-top">Em entrevista ${ICONS.calendar}</span><strong>${counts[2]}</strong><small>Uma conversa para avançar</small></button></section>
<div class="grid-two"><section class="panel"><div class="panel-head"><div><h2>Candidaturas recebidas</h2><p>${list.length} candidaturas no período · clica numa coluna para explorar</p></div><span class="small-tag">${state.days} dias</span></div><div class="chart">${bins.map((b,i)=>`<button class="chart-column" data-bin="${b.min},${b.max}" aria-label="Ver ${vals[i]} candidaturas de ${fmt(new Date(today.getTime()-b.max*86400000))}"><strong>${vals[i]||''}</strong><span class="chart-bar" style="--bar:${Math.max(2,vals[i]/max*139)}px"></span></button>`).join('')}</div><div class="chart-labels">${bins.map(b=>`<span>${fmt(new Date(today.getTime()-b.max*86400000))}</span>`).join('')}</div></section><section class="panel"><div class="panel-head"><div><h2>O processo, num olhar.</h2><p>Distribuição atual das candidaturas do período</p></div></div><div class="funnel">${STAGES.slice(0,4).map((s,i)=>`<button class="funnel-row" data-stage="${i}"><span class="funnel-text"><span>${s}</span><b>${counts[i]}</b></span><span class="track"><i style="--w:${counts[i]/Math.max(1,list.length)*100}%;--c:${COLORS[i]}"></i></span></button>`).join('')}<p class="funnel-bottom">${list.filter(a=>a.stage<4).length} em curso · ${list.filter(a=>a.stage>=4).length} concluída(s)</p></div></section></div>
<div class="grid-two"><section class="panel"><div class="panel-head"><div><h2>As candidaturas mais recentes</h2><p>Uma entrada para conhecer o próximo talento</p></div><button data-go-candidates>Ver todas →</button></div>${recentTable(list.slice(0,5))}</section><section class="panel"><div class="panel-head"><div><h2>Próximas ações</h2><p>Exemplos de organização da equipa</p></div><span class="small-tag">3 no exemplo</span></div><div class="tasks">${taskRows()}</div></section></div>`;}
function board(){let list=filtered();const cols=state.stage==='all'?STAGES:state.stage==='review'?STAGES.slice(0,2):STAGES.filter((s,i)=>String(i)===state.stage);return `<div class="board" aria-label="Funil de seleção demonstrativo">${cols.map(s=>{const i=STAGES.indexOf(s),items=list.filter(a=>a.stage===i);return `<section class="column" data-drop-stage="${i}" aria-label="${s}" style="--col:${COLORS[i]}"><div class="column-header"><h2 style="font-size:11px"><i></i>${s}</h2><span>${items.length}</span></div>${items.map(a=>`<article class="candidate" tabindex="0" role="button" aria-label="Abrir ${a.name}" draggable="true" data-profile="${a.id}" data-drag="${a.id}">${person(a)}<h3 class="candidate-role">${esc(jobOf(a).title)}</h3><p class="candidate-meta">${esc(jobOf(a).location)} · ${fmt(dateOf(a))}</p><div class="tags">${(a.job==='java'?['Java','Spring Boot']:['PHP','Laravel']).map(t=>`<span>${t}</span>`).join('')}</div><div class="candidate-foot"><span>${a.owner||'Por atribuir'}</span><b>PDF · reservado</b></div></article>`).join('')||'<div class="empty">Sem candidaturas nesta etapa</div>'}</section>`}).join('')}</div>`;}
function candidates(){return heading('Vextech / Seleção','Cada candidatura, um percurso.','Organiza as etapas e mantém a próxima ação à vista.',`<button class="btn secondary" data-plan>Como funciona ${ICONS.arrow}</button>`)+filters(true)+`<div class="selection-head"><p>${filtered().length} candidaturas · ${state.q?`pesquisa «${esc(state.q)}»`:'todos os perfis são ilustrativos'}${state.stage==='review'?' · recebidas e triagem':''}</p><div class="segmented" aria-label="Apresentação"><button data-layout="board" aria-pressed="${state.layout==='board'}">${ICONS.layers}Funil</button><button data-layout="table" aria-pressed="${state.layout==='table'}">${ICONS.list}Lista</button></div></div>${state.layout==='board'?board():`<section class="panel">${recentTable(filtered(),true)}</section>`}`;}
function vacancies(){return heading('Vextech / Oportunidades','As vagas que ligam talento.','Publicar, acompanhar e manter cada oportunidade atualizada.',`<button class="btn" data-job-new>${ICONS.plus}Nova vaga</button>`)+`<section class="panel"><div class="jobs-intro">O editor mantém descrição, requisitos, localização e capa — capacidades que já existem no painel atual.</div><div class="table-wrap"><table class="jobs-table"><thead><tr><th>Oportunidade</th><th>Estado</th><th>Candidaturas</th><th>Ações</th></tr></thead><tbody>${jobs.map(j=>`<tr><td class="title"><strong>${esc(j.title)}</strong><span>${esc(j.location)} · capa editável</span></td><td><span class="stage ${j.active?'s-contratado':''}">${j.active?'Ativa':'Inativa'}</span></td><td>${apps.filter(a=>a.job===j.id).length} no exemplo</td><td><div class="job-actions"><button class="row-link" data-job-edit="${j.id}">Editar ${ICONS.arrow}</button><button class="row-link" data-job-apps="${j.id}">Ver candidaturas</button></div></td></tr>`).join('')}</tbody></table></div></section>`;}
function render(){document.getElementById('crumb').textContent={dashboard:'Visão geral',candidaturas:'Candidaturas',vagas:'Vagas'}[state.view];document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));main.innerHTML=({dashboard,candidaturas:candidates,vagas:vacancies}[state.view])()+`<div class="footer-note"><span>Proposta visual 01 · perfis e números ilustrativos · nada é enviado ou gravado no painel real.</span><button data-plan>Ver fases e funcionalidades →</button></div>`;document.getElementById('nav-count').textContent=apps.length;document.getElementById('nav-jobs').textContent=jobs.filter(j=>j.active).length;bindMain();}
function go(view){state.view=view;document.getElementById('rail').classList.remove('is-open');document.getElementById('mobile-menu').setAttribute('aria-expanded','false');render();window.scrollTo({top:0,behavior:'instant'});}
function goCandidates(stage='all',layout='board'){state.stage=stage;state.layout=layout;go('candidaturas');}
function bindMain(){main.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('change',()=>{state[el.dataset.filter]=el.dataset.filter==='days'?Number(el.value):el.value;state.focus=null;render()}));main.querySelectorAll('[data-layout]').forEach(el=>el.addEventListener('click',()=>{state.layout=el.dataset.layout;render()}));main.querySelectorAll('[data-profile]').forEach(el=>{el.addEventListener('click',e=>{e.stopPropagation();openProfile(Number(el.dataset.profile))});el.addEventListener('keydown',e=>{if(e.target===el&&['Enter',' '].includes(e.key)){e.preventDefault();openProfile(Number(el.dataset.profile))}})});main.querySelectorAll('[data-bin]').forEach(el=>el.addEventListener('click',()=>{const [min,max]=el.dataset.bin.split(',').map(Number);state.focus={min,max};goCandidates('all','table')}));main.querySelectorAll('[data-stage]').forEach(el=>el.addEventListener('click',()=>goCandidates(el.dataset.stage)));main.querySelectorAll('[data-kpi]').forEach(el=>el.addEventListener('click',()=>{if(el.dataset.kpi==='review'){state.stage='review';state.layout='table';go('candidaturas')}else goCandidates('2')}));main.querySelectorAll('[data-clear-focus]').forEach(el=>el.addEventListener('click',()=>{state.focus=null;render()}));main.querySelectorAll('[data-drag]').forEach(el=>el.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',el.dataset.drag)));main.querySelectorAll('[data-drop-stage]').forEach(el=>{el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over')});el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));el.addEventListener('drop',e=>{e.preventDefault();const a=apps.find(a=>a.id===Number(e.dataTransfer.getData('text/plain')));if(a)moveStage(a,Number(el.dataset.dropStage));})});}
function drawerHead(label){return `<div class="drawer-top"><span>${label}</span><button class="drawer-close" aria-label="Fechar painel" data-close>${ICONS.close}</button></div>`;}
function showDrawer(content){document.getElementById('drawer-content').innerHTML=content;drawer.querySelector('[data-close]').addEventListener('click',()=>drawer.close());if(!drawer.open)drawer.showModal();}
function moveStage(a,stage){if(a.stage!==stage){a.stage=stage;a.history.unshift({text:`Etapa alterada para ${STAGES[stage]} · simulação`,date:new Date()});render();notify('Simulação: etapa atualizada apenas neste protótipo.')} }
function openProfile(id,tab='resumo'){const a=apps.find(a=>a.id===id);if(!a)return;const j=jobOf(a);showDrawer(drawerHead(`Candidatura #VT-${String(a.id).padStart(3,'0')}`)+`<div class="profile-header"><span class="person-icon">${String(a.id).padStart(2,'0')}</span><div><h2 id="drawer-title">${a.name}</h2><p>${esc(j.title)} · ${esc(j.location)}</p></div></div><div class="profile-stage"><label for="move-stage">Etapa da candidatura</label><select id="move-stage">${STAGES.map((s,i)=>`<option value="${i}"${selected(a.stage,i)}>${s}</option>`).join('')}</select></div><div class="segmented profile-tabs"><button data-profile-tab="resumo" aria-pressed="${tab==='resumo'}">Resumo</button><button data-profile-tab="historico" aria-pressed="${tab==='historico'}">Histórico</button></div>${tab==='resumo'?`<dl class="profile-grid"><div><dt>Email ilustrativo</dt><dd>${a.email}</dd></div><div><dt>Responsável</dt><dd>${a.owner||'Por atribuir'}</dd></div><div><dt>Disponibilidade</dt><dd>Por confirmar</dd></div><div><dt>Expectativa salarial</dt><dd>Não registada</dd></div></dl><div class="doc-box">${ICONS.file}<div><strong>Currículo em PDF</strong><small>Descarga protegida já disponível no painel atual.</small></div></div><h3>Notas internas</h3><div class="notes">${a.notes.map(n=>`<p>${esc(n.text)}<small>Nota desta simulação · ${fmt(n.date)}</small></p>`).join('')||'<p style="color:var(--muted)">Ainda sem notas neste exemplo.</p>'}</div><form class="note-form" id="note-form"><label class="sr" for="note-text">Adicionar nota</label><textarea id="note-text" maxlength="1500" placeholder="Registar uma observação ou a próxima ação…" required></textarea><button class="btn small" type="submit">Guardar nota na simulação</button></form><p class="prototype-tip">Este perfil é fictício. Não existe currículo real associado ao protótipo. As notas e alterações desaparecem ao atualizar a página.</p>`:`<ul class="history">${a.history.map(h=>`<li>${esc(h.text)}<small>${fmt(h.date)}</small></li>`).join('')}</ul><p class="prototype-tip">Na implementação, o histórico registará quem alterou a etapa, quando e porquê. Os eventos deste desenho são ilustrativos.</p>`}`);drawer.querySelector('#move-stage').addEventListener('change',e=>{moveStage(a,Number(e.target.value));openProfile(id,tab)});drawer.querySelectorAll('[data-profile-tab]').forEach(b=>b.addEventListener('click',()=>openProfile(id,b.dataset.profileTab)));drawer.querySelector('#note-form')?.addEventListener('submit',e=>{e.preventDefault();const text=drawer.querySelector('#note-text').value.trim();if(text){a.notes.push({text,date:new Date()});openProfile(id);notify('Nota guardada só na simulação.')}});}
function openJob(id){const j=jobs.find(j=>j.id===id)||{id:'',title:'',location:'',active:true,description:''};showDrawer(drawerHead('Editor de oportunidades')+`<h2 id="drawer-title" style="font-size:29px;letter-spacing:-.04em">${j.id?'Editar oportunidade':'Uma nova oportunidade.'}</h2><p class="prototype-tip">Pré-visualização do editor. Sem ligação ao site ou à API.</p><form class="editor" id="job-form"><label>Título<input name="title" value="${esc(j.title)}" maxlength="160" required></label><label>Localização<input name="location" value="${esc(j.location)}" maxlength="120" required></label><label>Descrição<textarea name="description">${esc(j.description)}</textarea></label><label>Estado<select name="active"><option value="1"${selected(j.active,true)}>Ativa</option><option value="0"${selected(j.active,false)}>Inativa</option></select></label><p class="prototype-tip">O painel real mantém também os requisitos e a capa PNG/JPG já implementados.</p><button class="btn" type="submit">Guardar nesta simulação ${ICONS.arrow}</button></form>`);drawer.querySelector('#job-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);if(!j.id){j.id=`demo${jobs.length+1}`;jobs.push(j)}j.title=f.get('title').trim();j.location=f.get('location').trim();j.description=f.get('description').trim();j.active=f.get('active')==='1';drawer.close();render();notify('Simulação guardada. Nenhuma vaga real foi alterada.')});}
function openPlan(){showDrawer(drawerHead('Desenho e planeamento')+`<h2 id="drawer-title" style="font-size:29px;letter-spacing:-.04em">Uma base para crescer.</h2><p class="prototype-tip">Este protótipo antecipa a direção visual e as fases 1 e 2. Não liga à API nem substitui o painel atual.</p>${[['Fase 1','Uma visão operacional moderna.','Novo layout e temas, vagas e candidaturas atuais, pesquisa e indicadores fiéis aos dados existentes.'],['Fase 2','Acompanhar cada percurso.','Etapas, responsáveis, notas internas, próximas ações e histórico auditável. Migração das candidaturas existentes sem inventar estados anteriores.'],['Fase 3','Coordenar a equipa.','Agenda, entrevistas, avaliações estruturadas e modelos de comunicação com revisão antes do envio.'],['Fase 4','Aprender e encontrar talento.','Banco de talentos com autorização, gestão da conservação e indicadores calculados a partir do histórico disponível.']].map(([s,h,p])=>`<div class="roadmap-item"><span>${s}</span><h3>${h}</h3><p>${p}</p></div>`).join('')}<p class="prototype-tip">Todos os perfis, etapas, tarefas e números apresentados são ilustrativos. A implementação começa depois da revisão do desenho.</p>`);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-plan'))openPlan();if(b.dataset.view){state.stage='all';state.focus=null;go(b.dataset.view)}if(b.hasAttribute('data-go-candidates'))goCandidates();if(b.hasAttribute('data-job-new'))openJob();if(b.dataset.jobEdit)openJob(b.dataset.jobEdit);if(b.dataset.jobApps){state.job=b.dataset.jobApps;goCandidates()}});
drawer.addEventListener('click',e=>{const r=drawer.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)drawer.close()});
document.getElementById('global-search').addEventListener('input',e=>{state.q=e.target.value;state.stage='all';state.view='candidaturas';render()});
document.getElementById('alerts').addEventListener('click',()=>showDrawer(drawerHead('Organização da equipa')+`<h2 id="drawer-title" style="font-size:27px;letter-spacing:-.04em">Próximas ações</h2><p class="prototype-tip">Tarefas ilustrativas. Não são enviados lembretes.</p><div class="tasks">${taskRows()}</div>`));
drawer.addEventListener('click',e=>{const b=e.target.closest('[data-profile]');if(b)openProfile(Number(b.dataset.profile))});
document.getElementById('mobile-menu').addEventListener('click',()=>{const aberto=document.getElementById('rail').classList.toggle('is-open');document.getElementById('mobile-menu').setAttribute('aria-expanded',String(aberto))});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('rail').classList.remove('is-open');document.getElementById('mobile-menu').setAttribute('aria-expanded','false')}});
document.getElementById('rail-close').addEventListener('click',()=>{document.getElementById('rail').classList.remove('is-open');document.getElementById('mobile-menu').setAttribute('aria-expanded','false');document.getElementById('mobile-menu').focus()});
let theme;try{theme=localStorage.getItem('vextech-proposta-tema')}catch{}if(!['light','dark'].includes(theme))theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
function applyTheme(){document.documentElement.dataset.theme=theme;const b=document.getElementById('theme-toggle');b.innerHTML=ICONS[theme==='light'?'moon':'sun'];b.setAttribute('aria-label',`Ativar tema ${theme==='light'?'escuro':'claro'}`)}
document.getElementById('theme-toggle').addEventListener('click',()=>{theme=theme==='light'?'dark':'light';applyTheme();try{localStorage.setItem('vextech-proposta-tema',theme)}catch{}});applyTheme();render();
</script>
</body></html>
